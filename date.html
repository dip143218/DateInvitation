<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Our Date ❤️</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="mainPage">

<div class="card">

<h1>📅 Pick Our Date</h1>

<p>
Choose a date and time that makes you smile ❤️
</p>

<br>

<input
type="date"
id="datePicker"
style="padding:15px;width:80%;font-size:20px;border-radius:12px;border:none;margin-bottom:20px;">

<br>

<input
type="time"
id="timePicker"
style="padding:15px;width:80%;font-size:20px;border-radius:12px;border:none;">

<br><br>

<button
class="yes"
onclick="saveDate()">

Next ➜

</button>

</div>

</div>

<script src="script.js"></script>

</body>

</html>
